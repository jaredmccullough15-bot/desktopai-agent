version: 1
applications:
  - appRoot: bill-web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
  - appRoot: jarvis-platform/apps/bill-core
    backend:
      phases:
        build:
          commands:
            - cd $AMPLIFY_MONO_REPO_ROOT/jarvis-platform/apps/bill-core
            - python -m pip install --upgrade pip
            - pip install -r requirements.txt
      artifacts:
        baseDirectory: .
        files:
          - 'main.py'
          - 'requirements.txt'
          - 'schemas.py'
          - 'Procfile'
          - 'conversational/**/*'
          - 'app/**/*'
          - '*.py'
